
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b14;color:#f4f4fc;font-family:Arial,sans-serif;height:100vh;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column;max-width:1000px;margin:auto}
header{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #25283a;background:#101321}
.logo{font-size:22px;font-weight:bold;letter-spacing:1px;color:#9b8cff}
.status{font-size:12px;color:#65d6a0}
main{flex:1;overflow-y:auto;padding:25px 16px}
.welcome{text-align:center;margin:12vh auto 30px;max-width:600px}
.welcome h1{font-size:35px;margin-bottom:12px;background:linear-gradient(90deg,#9c8cff,#55d9d0);color:transparent;background-clip:text}
.welcome p{color:#999db2;line-height:1.8}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:550px;margin:25px auto}
.suggestions button{background:#14192a;border:1px solid #292e45;color:#d9d9e8;padding:14px;border-radius:12px;cursor:pointer;text-align:right}
.suggestions button:hover{border-color:#8b7cff}
.message{max-width:85%;padding:13px 16px;border-radius:15px;margin:12px 0;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#6555c9;margin-right:auto;border-bottom-left-radius:4px}
.bot{background:#171c2c;border:1px solid #292e40;margin-left:auto;border-bottom-right-radius:4px}
.composer{padding:15px;background:#101321;border-top:1px solid #25283a}
.input-area{display:flex;align-items:flex-end;gap:10px;background:#191e30;border:1px solid #303650;border-radius:15px;padding:10px}
textarea{flex:1;resize:none;background:transparent;border:0;outline:none;color:white;font-size:16px;min-height:28px;max-height:120px;font-family:Arial;line-height:1.6}
.send{background:#7765ed;color:white;border:0;border-radius:11px;padding:12px 18px;font-size:15px;cursor:pointer}
.send:disabled{opacity:.5}
.note{text-align:center;color:#777d91;font-size:11px;margin-top:9px}
@media(max-width:500px){.welcome h1{font-size:29px}.suggestions{grid-template-columns:1fr}.message{max-width:94%}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">NEXORA AI</div>
<div class="status">● متصل</div>
</header>

<main id="content">
<div class="welcome" id="welcome">
<h1>أهلاً بك في NEXORA</h1>
<p>مساعدك الذكي للإجابة عن أسئلتك ومساعدتك في أفكارك ومهامك.</p>
<div class="suggestions">
<button onclick="useSuggestion('اشرح لي الذكاء الاصطناعي بطريقة بسيطة')">اشرح لي موضوعاً</button>
<button onclick="useSuggestion('ساعدني في كتابة فكرة إبداعية')">اكتب لي فكرة</button>
<button onclick="useSuggestion('ساعدني في حل مشكلة تقنية')">حل مشكلة تقنية</button>
<button onclick="useSuggestion('علمني مهارة جديدة')">تعلم شيئاً جديداً</button>
</div>
</div>
<div id="chat"></div>
</main>

<div class="composer">
<div class="input-area">
<textarea id="promptBox" placeholder="اكتب رسالتك إلى NEXORA..." rows="1"></textarea>
<button class="send" id="sendBtn" onclick="sendMessage()">إرسال ↑</button>
</div>
<div class="note">قد يخطئ الذكاء الاصطناعي أحياناً، راجع المعلومات المهمة.</div>
</div>
</div>

<script>
const promptBox=document.getElementById('promptBox');
const chat=document.getElementById('chat');
const welcome=document.getElementById('welcome');
const sendBtn=document.getElementById('sendBtn');

let messages=[];

function addMessage(text,type){
const div=document.createElement('div');
div.className='message '+type;
div.textContent=text;
chat.appendChild(div);
document.getElementById('content').scrollTop=document.getElementById('content').scrollHeight;
return div;
}

async function sendMessage(){
const text=promptBox.value.trim();
if(!text || sendBtn.disabled)return;

welcome.style.display='none';
addMessage(text,'user');
promptBox.value='';
promptBox.style.height='auto';

messages.push({role:'user',content:text});
sendBtn.disabled=true;

const loading=addMessage('NEXORA يفكر...','bot');

try{
const response=await fetch('/api/chat',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({messages:messages})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error?.message||data.error||'تعذر الاتصال بالخدمة');
}

const answer=data.choices?.[0]?.message?.content;

if(!answer)throw new Error('لم يصل رد من النموذج');

loading.textContent=answer;
messages.push({role:'assistant',content:answer});

}catch(error){
loading.textContent='حدث خطأ: '+error.message;
messages.pop();
}finally{
sendBtn.disabled=false;
promptBox.focus();
}
}

function useSuggestion(text){
promptBox.value=text;
sendMessage();
}

promptBox.addEventListener('keydown',function(e){
if(e.key==='Enter'&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

promptBox.addEventListener('input',function(){
this.style.height='auto';
this.style.height=Math.min(this.scrollHeight,120)+'px';
});
</script>
</body>
</html>
