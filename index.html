<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b14">
<title>NEXORA AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

:root {
--bg:#090b14;
--panel:#111522;
--panel2:#191f30;
--text:#f4f5ff;
--muted:#929bb1;
--blue:#5865f2;
--purple:#a855f7;
--border:rgba(255,255,255,.08);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Cairo',sans-serif;
background:var(--bg);
color:var(--text);
height:100dvh;
overflow:hidden;
}

.app{display:flex;height:100dvh}

.sidebar{
width:260px;
background:#0d101b;
border-left:1px solid var(--border);
padding:22px 16px;
display:flex;
flex-direction:column;
transition:.3s;
}

.logo{
font-size:25px;
font-weight:800;
letter-spacing:1px;
background:linear-gradient(90deg,#6675ff,#bd68ff);
-webkit-background-clip:text;
color:transparent;
margin-bottom:30px;
}

.new-chat{
background:linear-gradient(110deg,#5865f2,#a855f7);
border:0;
padding:13px;
border-radius:12px;
color:white;
font-family:inherit;
font-weight:700;
cursor:pointer;
margin-bottom:22px;
}

.nav-item{
padding:12px;
border-radius:10px;
color:var(--muted);
cursor:pointer;
margin-bottom:7px;
transition:.2s;
}

.nav-item:hover,.nav-item.active{
background:var(--panel2);
color:white;
}

.sidebar-bottom{
margin-top:auto;
color:var(--muted);
font-size:12px;
text-align:center;
}

.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

.header{
height:70px;
padding:0 25px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border);
}

.header-title{font-size:17px;font-weight:700}

.status{font-size:12px;color:#4ade80}

.status:before{
content:"";
display:inline-block;
width:7px;height:7px;
background:#4ade80;
border-radius:50%;
margin-left:7px;
}

.chat-area{
flex:1;
overflow-y:auto;
padding:30px 15px;
}

.welcome{
text-align:center;
margin:11vh auto 30px;
max-width:600px;
}

.welcome h1{
font-size:clamp(30px,5vw,48px);
font-weight:800;
background:linear-gradient(90deg,#7180ff,#bd68ff);
-webkit-background-clip:text;
color:transparent;
}

.welcome p{color:var(--muted);margin-top:10px}

.suggestions{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:25px;
}

.suggestion{
padding:11px 15px;
background:var(--panel);
border:1px solid var(--border);
border-radius:12px;
color:#dce0f0;
cursor:pointer;
font-family:inherit;
font-size:13px;
}

.suggestion:hover{border-color:var(--blue)}

.messages{max-width:850px;margin:auto}

.message{
display:flex;
margin-bottom:22px;
gap:12px;
align-items:flex-start;
}

.avatar{
min-width:35px;
height:35px;
border-radius:11px;
display:grid;
place-items:center;
background:linear-gradient(135deg,#5865f2,#a855f7);
font-size:14px;
font-weight:800;
}

.message.user .avatar{background:#272e43}

.message-content{
background:var(--panel);
padding:13px 17px;
border-radius:13px;
max-width:85%;
line-height:1.9;
font-size:14px;
overflow-wrap:anywhere;
white-space:pre-wrap;
}

.message.user .message-content{background:#191f31}

.message-content img{
max-width:100%;
border-radius:10px;
margin-top:10px;
}

.input-section{
padding:15px 20px 20px;
max-width:950px;
width:100%;
margin:auto;
}

.input-box{
background:var(--panel);
border:1px solid rgba(120,120,255,.22);
border-radius:18px;
padding:12px;
display:flex;
flex-direction:column;
}

textarea{
background:transparent;
border:0;
outline:0;
color:white;
font-family:inherit;
resize:none;
padding:10px;
min-height:48px;
max-height:140px;
font-size:14px;
width:100%;
}

textarea::placeholder{color:#777f96}

.input-actions{display:flex;align-items:center;gap:9px}

.action-btn{
border:1px solid var(--border);
background:var(--panel2);
color:#dce0f0;
border-radius:10px;
padding:9px 13px;
cursor:pointer;
font-family:inherit;
font-size:12px;
}

.upload-btn{
background:linear-gradient(110deg,#5865f2,#a855f7);
border:0;
color:white;
font-weight:700;
}

.send-btn{
margin-right:auto;
background:linear-gradient(110deg,#5865f2,#a855f7);
color:white;
border:0;
width:42px;
height:42px;
border-radius:12px;
cursor:pointer;
font-size:18px;
}

.disclaimer{
text-align:center;
font-size:10px;
color:#707990;
margin-top:10px;
}

#fileInput{display:none}

.preview{
display:none;
padding:8px;
color:#a5b4fc;
font-size:12px;
}

.menu-btn{
display:none;
background:transparent;
border:0;
color:white;
font-size:22px;
cursor:pointer;
}

@media(max-width:750px){
.sidebar{
position:fixed;
right:-270px;
top:0;bottom:0;
z-index:10;
box-shadow:0 0 30px #000;
}
.sidebar.open{right:0}
.menu-btn{display:block}
.header{padding:0 15px}
.input-section{padding:10px}
.welcome{margin-top:10vh}
.message-content{max-width:90%}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
<div class="logo">NEXORA AI</div>

<button class="new-chat" onclick="newChat()">+ محادثة جديدة</button>

<div class="nav-item active" onclick="newChat()">◈ المحادثة</div>
<div class="nav-item" onclick="generateImageMode()">◈ إنشاء الصور</div>
<div class="nav-item" onclick="startVoice()">◈ المحادثة الصوتية</div>
<div class="nav-item" onclick="showLibrary()">◈ مكتبتي</div>

<div class="sidebar-bottom">
NEXORA AI © 2026
<br>
Your AI. Your World.
</div>
</aside>

<main class="main">

<header class="header">
<div style="display:flex;align-items:center;gap:13px">
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="header-title">NEXORA AI</div>
</div>
<div class="status">جاهز للمحادثة</div>
</header>

<section class="chat-area" id="chatArea">

<div class="welcome" id="welcome">
<h1>مرحباً بك في NEXORA</h1>
<p>مساعدك الذكي للإبداع والتعلم والإجابة عن أسئلتك.</p>

<div class="suggestions">
<button class="suggestion" onclick="suggest('اشرح لي موضوعاً صعباً بطريقة بسيطة')">✦ اشرح لي شيئاً</button>
<button class="suggestion" onclick="suggest('ساعدني في كتابة فكرة إبداعية')">✦ اكتب لي فكرة</button>
<button class="suggestion" onclick="generateImageMode()">✦ إنشاء صورة</button>
<button class="suggestion" onclick="suggest('ساعدني في البرمجة')">✦ البرمجة</button>
</div>
</div>

<div class="messages" id="messages"></div>
</section>

<section class="input-section">
<div class="input-box">

<div class="preview" id="preview"></div>

<textarea id="userInput"
placeholder="اسأل NEXORA AI أي شيء..."
rows="1"
onkeydown="handleKey(event)"></textarea>

<div class="input-actions">

<button class="action-btn upload-btn" onclick="document.getElementById('fileInput').click()">＋ إضافة صورة</button>

<input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">

<button class="action-btn" onclick="startVoice()">🎙 صوت</button>

<button class="send-btn" onclick="sendMessage()">↑</button>

</div>
</div>

<div class="disclaimer">
قد يقدم الذكاء الاصطناعي معلومات غير دقيقة. تحقق من المعلومات المهمة.
</div>
</section>

</main>
</div>

<script>
const input=document.getElementById("userInput");
const messages=document.getElementById("messages");
const welcome=document.getElementById("welcome");
const chatArea=document.getElementById("chatArea");

let conversation=[];
let selectedFile=null;
let imageMode=false;

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("open");
}

function newChat(){
messages.innerHTML="";
conversation=[];
welcome.style.display="block";
imageMode=false;
selectedFile=null;
document.getElementById("preview").style.display="none";
input.placeholder="اسأل NEXORA AI أي شيء...";
document.getElementById("sidebar").classList.remove("open");
}

function suggest(text){
input.value=text;
sendMessage();
}

function addMessage(text,type){
welcome.style.display="none";

const message=document.createElement("div");
message.className="message "+type;

const avatar=document.createElement("div");
avatar.className="avatar";
avatar.textContent=type==="user"?"أنت":"N";

const content=document.createElement("div");
content.className="message-content";
content.textContent=text;

message.appendChild(avatar);
message.appendChild(content);
messages.appendChild(message);

chatArea.scrollTop=chatArea.scrollHeight;
}

function handleKey(event){
if(event.key==="Enter"&&!event.shiftKey){
event.preventDefault();
sendMessage();
}
}

function handleFile(event){
const file=event.target.files[0];
if(!file)return;

selectedFile=file;
const preview=document.getElementById("preview");
preview.style.display="block";
preview.textContent="تم اختيار الصورة: "+file.name;
}

async function sendMessage(){
const text=input.value.trim();
if(!text&&!selectedFile)return;

let message=text;

if(selectedFile){
message+=(message?"\n":"")+"[الصورة المرفقة: "+selectedFile.name+"]";
}

addMessage(message,"user");

conversation.push({role:"user",content:text});

input.value="";
selectedFile=null;
document.getElementById("fileInput").value="";
document.getElementById("preview").style.display="none";

const loading=document.createElement("div");
loading.className="typing";
loading.textContent="NEXORA AI يفكر...";
messages.appendChild(loading);

chatArea.scrollTop=chatArea.scrollHeight;

// ربط واجهة المحادثة بخدمة AI يحتاج API.
loading.remove();

addMessage(
"واجهة NEXORA AI جاهزة! لسه محتاجين نربطها بمحرك ذكاء اصطناعي عشان تقدر ترد على أسئلتك فعلياً.",
"assistant"
);
}

function generateImageMode(){
imageMode=true;
input.placeholder="اكتب وصف الصورة التي تريد إنشاءها...";
document.getElementById("sidebar").classList.remove("open");
input.focus();
}

function startVoice(){
if(!("webkitSpeechRecognition" in window)&&!("SpeechRecognition" in window)){
addMessage("المتصفح لا يدعم التعرف على الصوت.","assistant");
return;
}

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const recognition=new SpeechRecognition();

recognition.lang="ar-EG";
recognition.onresult=function(event){
input.value=event.results[0][0].transcript;
};
recognition.start();
}

function showLibrary(){
addMessage("مكتبتك فارغة حالياً.","assistant");
document.getElementById("sidebar").classList.remove("open");
}
</script>

</body>
  </html>
